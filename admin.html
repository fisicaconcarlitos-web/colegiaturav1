<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel privado · Colegiatura</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="scene active"><p class="eyebrow">PANEL PRIVADO</p><h1>Respuestas de la invitación</h1><p class="sub">Introduce tu clave ADMIN_TOKEN de Vercel. No compartas este enlace ni la clave.</p><input id="token" type="password" placeholder="Clave de administración" style="padding:15px;border-radius:12px;width:min(100%,400px);margin:15px;background:white;border:0"><p><button class="primary" id="load">Consultar respuestas</button></p><p class="status" id="status"></p><div id="data" style="text-align:left;line-height:2"></div><button class="secondary" id="csv" hidden>Descargar CSV</button></section></main><script>let rows=[];document.getElementById('load').onclick=async()=>{const status=document.getElementById('status');status.textContent='Consultando…';try{const r=await fetch('/api/rsvp',{headers:{Authorization:'Bearer '+document.getElementById('token').value}});if(!r.ok)throw Error('Revisa la clave y la conexión a Supabase');rows=await r.json();status.textContent=rows.length+' respuestas registradas';document.getElementById('data').replaceChildren(...rows.map(x=>{const p=document.createElement('p');p.textContent=`${new Date(x.created_at).toLocaleString('es-PE')} · ${x.nombre} · ${x.respuesta==='si'?'Sí':'No'}`;return p}));document.getElementById('csv').hidden=false}catch(e){status.textContent=e.message}};document.getElementById('csv').onclick=()=>{const s='fecha,nombre,respuesta\n'+rows.map(x=>[x.created_at,x.nombre,x.respuesta].map(y=>'"'+String(y).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='respuestas-colegiatura.csv';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
