<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · Confirmaciones</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="card" style="width:min(100%,760px)"><p class="kicker">PANEL PRIVADO</p><h1>Confirmaciones</h1><p class="description">Ingresa tu clave de administración para consultar las respuestas guardadas.</p><input type="password" id="token" placeholder="Clave ADMIN_TOKEN" aria-label="Clave de administración"><button class="yes" id="load" style="margin:15px 0">Consultar respuestas</button><p id="status" role="status"></p><div id="stats"></div><div style="overflow:auto"><table id="rows" style="width:100%;text-align:left;border-spacing:0;font-size:13px"></table></div><button class="outline" id="csv" hidden>Exportar CSV</button></section></main><script>let records=[];document.querySelector('#load').onclick=async()=>{const status=document.querySelector('#status');status.textContent='Consultando…';try{const r=await fetch('/api/rsvp',{headers:{Authorization:'Bearer '+document.querySelector('#token').value}});const d=await r.json();if(!r.ok)throw Error(d.error);records=d;status.textContent='Resultados actualizados';document.querySelector('#stats').textContent=`Total: ${d.length} · Sí: ${d.filter(x=>x.respuesta==='si').length} · No: ${d.filter(x=>x.respuesta==='no').length}`;const table=document.querySelector('#rows');table.replaceChildren();const head=table.insertRow();['Nombre','Respuesta','Fecha'].forEach(x=>{const c=document.createElement('th');c.textContent=x;head.append(c)});d.forEach(x=>{const tr=table.insertRow();[x.nombre,x.respuesta==='si'?'Sí':'No',new Date(x.created_at).toLocaleString('es-PE')].forEach(v=>{const td=tr.insertCell();td.textContent=v})});document.querySelector('#csv').hidden=false}catch(e){status.textContent=e.message}};document.querySelector('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const content='\uFEFFNombre,Respuesta,Fecha\n'+records.map(x=>[x.nombre,x.respuesta,x.created_at].map(q).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download='confirmaciones_colegiatura.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
